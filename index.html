<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXcious Mini App</title>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h2 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: #38bdf8;
            margin-top: 0;
        }

        .balance {
            font-size: 2.2rem;
            font-weight: bold;
            margin: 10px 0;
            color: #f59e0b;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background-color: #3b82f6;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        button:active {
            background-color: #2563eb;
        }

        input {
            width: 90%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: white;
            margin-top: 8px;
            margin-bottom: 12px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- بەشی پیشاندانی خاڵەکان -->
        <div class="card">
            <h2>Your Points</h2>
            <div class="balance" id="pointsDisplay">0</div>
            <p style="font-size: 0.85rem; color: #94a3b8;">Earn points by watching ads!</p>
        </div>

        <!-- بەشی ڕیکلام -->
        <div class="card">
            <h2>Monetization</h2>
            <button id="showAdBtn">تەماشای ڕیکلام بکە (+5 Points)</button>
        </div>

        <!-- بەشی ڕاکێشانی خاڵ/باڵانس -->
        <div class="card">
            <h2>Withdraw</h2>
            <input type="text" id="walletInput" placeholder="Enter Wallet Address">
            <button onclick="requestWithdrawal()">Request Withdrawal (500 Points)</button>
        </div>
    </div>

    <script>
        // ئامادەکردنی تەلەگرام WebApp
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        let points = 0;

        function updateUI() {
            document.getElementById('pointsDisplay').innerText = points;
        }

        // ڕێکخستنی Adsgram SDK
        const AdController = window.Adsgram.init({ 
            blockId: "55168" 
        });

        // کلیک لەسەر دوگمەی ڕیکلام
        document.getElementById('showAdBtn').addEventListener('click', () => {
            AdController.show().then((result) => {
                // بەکارهێنەر ڕیکلامەکەی بە تەواوی بینی
                points += 5;
                updateUI();
                
                if (tg) {
                    tg.showAlert("پیرۆزە! ٥ خاڵت وەرگرت.");
                } else {
                    alert("پیرۆزە! ٥ خاڵت وەرگرت.");
                }
            }).catch((result) => {
                // کاتێک ڕیکلامەکە تەواو ناکرێت یان بەردەست نییە
                console.log("Ad status/error:", result);
                if (tg) {
                    tg.showAlert("ڕیکلام بەردەست نییە یان پێشوەختە داخرا!");
                } else {
                    alert("ڕیکلام بەردەست نییە یان پێشوەختە داخرا!");
                }
            });
        });

        // داواکاری ڕاکێشانی خاڵەکان
        function requestWithdrawal() {
            let wallet = document.getElementById('walletInput').value.trim();
            if (!wallet) {
                if (tg) tg.showAlert("Please enter your wallet address!");
                else alert("Please enter your wallet address!");
                return;
            }
            if (points < 500) {
                if (tg) tg.showAlert("You have less than 500 points, you cannot withdraw yet.");
                else alert("You have less than 500 points, you cannot withdraw yet.");
                return;
            }
            
            if (tg) tg.showAlert("Withdrawal request submitted successfully!");
            else alert("Withdrawal request submitted successfully!");
            
            points -= 500;
            updateUI();
            document.getElementById('walletInput').value = '';
        }
    </script>
</body>
</html>
