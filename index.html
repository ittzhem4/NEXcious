<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXcious Bot - پاداشتی ڕیکلام</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/sad-b3281.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #0f172a;
            color: #ffffff;
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 350px;
        }
        .btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #2563eb;
        }
        .balance {
            font-size: 28px;
            font-weight: bold;
            color: #4ade80;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>سیستەمی ڕیکلام</h2>
        <p>باڵانسی تۆ:</p>
        <div class="balance"><span id="points">0</span> خاڵ</div>
        
        <button class="btn" onclick="showAd()">سەیرکردنی ڕیکلام (+5 خاڵ)</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let points = 0;
        const AdController = window.Adsgram.init({ blockId: "YOUR-ADSGRAM-BLOCK-ID" });

        function showAd() {
            AdController.show().then((result) => {
                points += 5;
                document.getElementById('points').innerText = points;
                tg.showAlert("پاداشتەکەت بە سەرکەوتوویی وەرگرت! (+5 خاڵ)");
            }).catch((result) => {
                tg.showAlert("ڕیکلامەکە تەواو نەکرا یان بەردەست نییە.");
            });
        }
    </script>
</body>
</html>
